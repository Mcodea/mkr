name: Essais physiques OpenMCT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tests/reference/openmct.py
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
