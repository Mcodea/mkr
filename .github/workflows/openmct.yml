name: Essais physiques OpenMCT
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/openmct.yml'
      - 'tests/reference/openmct.py'
permissions:
  contents: read
jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: -r engine/requirements.txt
      - run: python tests/reference/openmct.py
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
