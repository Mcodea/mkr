name: Vérification MKR

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'
      - 'codex/**'
      - 'chatgpt/**'
  workflow_dispatch:

# One run per branch tip: a newer push cancels the older Windows run.
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer le moteur scientifique
        run: |
          python -m pip install --only-binary=:all: -r engine/requirements.txt
          python -m pip check
      - uses: actions/checkout@v5
        with:
          repository: jckantor/CBE30338-book
          ref: bec88ef9f6d9f8dcf1b24d87c52b5875fc1ffeb0
          path: reference-tclab
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /tclab/data/tclab-data.csv
      - name: Vérifier le refus sur les mesures physiques TCLab
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: python tests/reference/tclab_observed_step.py reference-tclab/tclab/data/tclab-data.csv
      - name: Restaurer et auditer les dépendances
        run: dotnet restore MKR.slnx
      - name: Compiler la solution WPF
        run: dotnet build MKR.slnx -c Release --no-restore
      - name: Tester le contrat Python
        run: python -m unittest discover -s engine -v
      - name: Tester SQLite et le processus Python depuis .NET
        env:
          MKR_TRANSFER_FIXTURE: ${{ runner.temp }}/mkr-transfer-fixture
          MKR_SAMPLE_PDF: mkr-etude-synthetique.pdf
        run: dotnet run --project tests/Mkr.Smoke -c Release --no-build
      - name: Tester les imports, l’affectation et la qualité temporelle
        run: python -m unittest discover -s tests -v
      - name: Installer les serveurs de référence Modbus et S7
        run: |
          python -m pip install --only-binary=:all: -r tests/interop/requirements.txt
      - name: Tester l’acquisition en lecture seule (Modbus TCP, S7comm, interopérabilité)
        env:
          MKR_INTEROP_PYTHON: python
        run: dotnet run --project tests/Mkr.Communication.Tests -c Release --no-build
      - name: Tester la description physique et les profils
        run: dotnet run --project tests/Mkr.PhysicalLoop.Tests -c Release --no-build
      - name: Vérifier le parcours graphique du catalogue
        shell: powershell
        run: .\tests\windows\catalogue.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MKR-exemple-fiche-PDF
          path: mkr-etude-synthetique.pdf
          if-no-files-found: error
      - name: Construire le paquet Windows autonome
        shell: pwsh
        run: ./scripts/package-windows.ps1 -OutputDirectory portable-MKR
      - name: Archiver et extraire la distribution à tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path distribution | Out-Null
          $archive = 'distribution/MKR-Windows-x64.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path portable-MKR).Path, (Join-Path $PWD $archive))
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  MKR-Windows-x64.zip" | Set-Content "$archive.sha256" -Encoding ascii
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Join-Path $PWD $archive), (Join-Path $env:RUNNER_TEMP 'MKR extrait'))
      - name: Installer le lecteur PDF de vérification
        run: |
          python -m pip install --only-binary=:all: pypdf==5.9.0
      - name: Tester le transfert PI depuis le paquet autonome
        shell: powershell
        run: ./tests/windows/transfer.ps1 -Executable "$env:RUNNER_TEMP/MKR extrait/Mkr.Desktop.exe" -Fixture "$env:RUNNER_TEMP/mkr-transfer-fixture"
      - name: Tester l’acquisition Schneider et Siemens depuis le paquet autonome
        shell: powershell
        run: ./tests/windows/acquisition.ps1 -Executable "$env:RUNNER_TEMP/MKR extrait/Mkr.Desktop.exe" -Fixture "$env:RUNNER_TEMP/mkr-transfer-fixture"
      - name: Ouvrir le catalogue depuis le paquet autonome
        shell: powershell
        run: ./tests/windows/catalogue.ps1 -Executable "$env:RUNNER_TEMP/MKR extrait/Mkr.Desktop.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MKR-Windows-x64
          path: distribution/
          retention-days: 30
          if-no-files-found: error
